name: Déploiement FTP OVH

# Déploie le site sur l'hébergement OVH (carredhotes.fr) à chaque push :
#   - branche main -> racine du site (https://carredhotes.fr)
#   - branche dev  -> dossier /dev (https://carredhotes.fr/dev) pour prévisualisation
# Le mot de passe FTP est stocké dans le secret GitHub "FTP_PASSWORD"
# (Settings > Secrets and variables > Actions). Il n'apparaît jamais dans le code.

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # permet aussi un déploiement manuel depuis l'onglet Actions

concurrency:
  group: deploy-ftp-ovh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoi des fichiers vers OVH
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Déploiement FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster131.hosting.ovh.net
          username: carredj
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ github.ref == 'refs/heads/dev' && '/www/dev/' || '/www/' }}
          exclude: |
            **/.git*
            **/.github/**
